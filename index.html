<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthdayyyyy❤️</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;500&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #fff0f5 0%, #ffe4ec 40%, #fce4ec 100%);
      font-family: 'Poppins', sans-serif;
      overflow-x: hidden;
      color: #5d4e6d;
      position: relative;
    }

    /* Floating hearts */
    .heart {
      position: fixed;
      font-size: 20px;
      color: #ff8fab;
      opacity: 0.6;
      animation: floatUp 8s linear infinite;
      pointer-events: none;
      z-index: 1;
    }

    @keyframes floatUp {
      0% {
        transform: translateY(100vh) rotate(0deg);
        opacity: 0.7;
      }
      100% {
        transform: translateY(-20vh) rotate(360deg);
        opacity: 0;
      }
    }

    .container {
      max-width: 520px;
      margin: 0 auto;
      padding: 40px 24px 60px;
      text-align: center;
      position: relative;
      z-index: 10;
    }

    .title {
      font-family: 'Great Vibes', cursive;
      font-size: 4.2rem;
      color: #e91e63;
      margin-bottom: 8px;
      text-shadow: 0 4px 15px rgba(233, 30, 99, 0.2);
      animation: softPulse 3s ease-in-out infinite;
    }

    @keyframes softPulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.03); }
    }

    .subtitle {
      font-size: 1.15rem;
      color: #c2185b;
      margin-bottom: 36px;
      letter-spacing: 1px;
      opacity: 0.9;
    }

    .card {
      background: rgba(255, 255, 255, 0.78);
      backdrop-filter: blur(12px);
      border-radius: 28px;
      padding: 32px 26px;
      box-shadow: 0 15px 40px rgba(233, 30, 99, 0.12);
      border: 1px solid rgba(255, 182, 193, 0.45);
      margin-bottom: 28px;
    }

    .message {
      font-size: 1.02rem;
      line-height: 1.75;
      color: #6b4c6b;
      text-align: left;
      white-space: pre-wrap;
    }

    .cursor {
      display: inline-block;
      width: 2px;
      height: 1.1em;
      background: #e91e63;
      margin-left: 2px;
      animation: blink 0.8s infinite;
      vertical-align: middle;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    .photo-area {
      display: flex;
      gap: 18px;
      justify-content: center;
      flex-wrap: wrap;
      margin: 28px 0 10px;
    }

    .photo-box {
      width: 160px;
      height: 200px;
      border-radius: 22px;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(233, 30, 99, 0.18);
      border: 3px solid white;
      background: #ffe0eb;
    }

    .photo-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .btn {
      background: linear-gradient(135deg, #ff6b9d, #e91e63);
      color: white;
      border: none;
      padding: 16px 42px;
      font-size: 1.1rem;
      border-radius: 50px;
      cursor: pointer;
      font-family: 'Poppins', sans-serif;
      font-weight: 500;
      box-shadow: 0 8px 25px rgba(233, 30, 99, 0.35);
      transition: all 0.3s ease;
      margin-top: 18px;
    }

    .btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 30px rgba(233, 30, 99, 0.45);
    }

    .footer {
      margin-top: 48px;
      font-size: 0.95rem;
      color: #c2185b;
      opacity: 0.75;
    }

    /* Confetti */
    .confetti {
      position: fixed;
      width: 10px;
      height: 10px;
      background: #ff6b9d;
      top: -10px;
      z-index: 100;
      animation: confettiFall 3s linear forwards;
    }

    @keyframes confettiFall {
      to {
        transform: translateY(100vh) rotate(720deg);
        opacity: 0;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <h1 class="title">Happy Birthday❤️</h1>
    <p class="subtitle">with all my love🥹</p>

    <div class="card">
      <div class="message" id="message"></div>
    </div>

    <div class="photo-area">
      <div class="photo-box">
        <img src="image1.jpeg" alt="Photo 1">
      </div>
      <div class="photo-box">
        <img src="image0.jpeg" alt="Photo 2">
      </div>
    </div>

    <button class="btn" onclick="celebrate()">Click for a little surprise</button>

    <p class="footer">Made with love just for you</p>
  </div>

  <script>
    // Floating hearts
    function createHeart() {
      const heart = document.createElement('div');
      heart.classList.add('heart');
      heart.innerHTML = '♥';
      heart.style.left = Math.random() * 100 + 'vw';
      heart.style.animationDuration = (6 + Math.random() * 5) + 's';
      heart.style.fontSize = (16 + Math.random() * 18) + 'px';
      document.body.appendChild(heart);

      setTimeout(() => {
        heart.remove();
      }, 9000);
    }

    setInterval(createHeart, 700);

    // Your birthday message with soft emojis
    const messageText = `Happy birthdayyyy 🎂✨

to the one who makes my little world
feel a little more magical ✨

i hope this new chapter of your life
is filled with the kind of happiness
that stays long after the candles go out.

may your dreams find their way to you,
may your heart always feel at home,
and may life be gentle with you
in all the ways you deserve 🥹❤️


i honestly don’t know how to put
everything i feel into words,
but thank you for everything❤️

thank you for being you,
for making me smile,
and for making my little world
a happier place to be.

if i could wish for one thing today,
it would be to see you smile
a thousand more times
and to be there for every single one.

in every little universe,
in every lifetime,
i think i’d still find my way to you.

thank you for being my favorite person
and my most beautiful kind of magic 💫

i love you more than words could ever hold
and a little more with every passing day.

happy birthdayyyy 
i hope this year loves you
as much as i do 💖`;

    const messageEl = document.getElementById('message');
    let i = 0;

    function typeWriter() {
      if (i < messageText.length) {
        messageEl.innerHTML = messageText.substring(0, i + 1) + '<span class="cursor"></span>';
        i++;
        setTimeout(typeWriter, 32);
      } else {
        messageEl.innerHTML = messageText;
      }
    }

    setTimeout(typeWriter, 900);

    // Celebrate button
    function celebrate() {
      for (let j = 0; j < 70; j++) {
        setTimeout(() => {
          const confetti = document.createElement('div');
          confetti.classList.add('confetti');
          confetti.style.left = Math.random() * 100 + 'vw';
          confetti.style.background = ['#ff6b9d', '#ff8fab', '#f48fb1', '#f8bbd0', '#e91e63', '#ffc0cb'][Math.floor(Math.random() * 6)];
          confetti.style.width = (6 + Math.random() * 9) + 'px';
          confetti.style.height = confetti.style.width;
          confetti.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
          document.body.appendChild(confetti);

          setTimeout(() => confetti.remove(), 3200);
        }, j * 28);
      }
    }
  </script>
</body>
</html>
